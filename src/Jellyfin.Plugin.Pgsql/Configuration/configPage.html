<!DOCTYPE html>
<html>
<head>
    <title>PostgreSQL</title>
</head>
<body>
    <div id="pgsqlConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h1>PostgreSQL database</h1>
                <p id="pgsqlCurrent"></p>
                <div id="pgsqlWarnings"></div>
                <form class="pgsqlForm">
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="pgsqlHost" label="Host" required />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="pgsqlPort" label="Port" min="1" max="65535" value="5432" required />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="pgsqlDatabase" label="Database" />
                        <div class="fieldDescription">Leave empty to use the user name.</div>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="pgsqlUsername" label="Username" required />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="password" id="pgsqlPassword" label="Password" autocomplete="new-password" />
                        <div class="fieldDescription">The password is stored in database.xml only and is never shown again.</div>
                    </div>
                    <div id="pgsqlTestResult" style="margin: 1em 0;"></div>
                    <div>
                        <button is="emby-button" type="button" id="pgsqlTest" class="raised block"><span>Test connection</span></button>
                        <button is="emby-button" type="submit" id="pgsqlApply" class="raised button-submit block"><span>Save &amp; restart</span></button>
                        <button is="emby-button" type="button" id="pgsqlSqlite" class="raised block"><span>Switch back to SQLite</span></button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#pgsqlConfigPage');
                var switchBackNotice = '';

                function el(id) { return page.querySelector('#' + id); }

                function call(method, path, body) {
                    var options = { type: method, url: ApiClient.getUrl('Pgsql/' + path), dataType: 'json' };
                    if (body) {
                        options.data = JSON.stringify(body);
                        options.contentType = 'application/json';
                    }
                    return ApiClient.ajax(options);
                }

                function settings() {
                    return {
                        host: el('pgsqlHost').value.trim(),
                        port: parseInt(el('pgsqlPort').value, 10) || 0,
                        database: el('pgsqlDatabase').value.trim(),
                        username: el('pgsqlUsername').value.trim(),
                        password: el('pgsqlPassword').value
                    };
                }

                function lines(container, items, color) {
                    container.textContent = '';
                    items.forEach(function (text) {
                        var p = document.createElement('p');
                        p.textContent = text;
                        if (color) { p.style.color = color; }
                        container.appendChild(p);
                    });
                }

                function yesNo(value) { return value ? 'yes' : 'no'; }

                function showAssessment(a) {
                    var out = [];
                    if (a.connected) {
                        out.push('Connected. PostgreSQL ' + a.serverVersion + '.');
                        out.push('Can create databases (CREATEDB): ' + yesNo(a.canCreateDatabase) + '. Owns the database: ' + yesNo(a.ownsDatabase) + '.');
                        var states = { Empty: 'The database is empty.', JellyfinSchema: 'The database already holds a Jellyfin schema.', Other: 'The database contains other tables.' };
                        out.push(states[a.targetState] || '');
                    }
                    lines(el('pgsqlTestResult'), out, null);
                    a.blockers.forEach(function (text) {
                        var p = document.createElement('p');
                        p.textContent = text;
                        p.style.color = '#cc3333';
                        el('pgsqlTestResult').appendChild(p);
                    });
                    if (a.canApply) {
                        var ok = document.createElement('p');
                        ok.textContent = 'These settings can be saved.';
                        ok.style.color = '#52b54b';
                        el('pgsqlTestResult').appendChild(ok);
                    }
                }

                function load() {
                    Dashboard.showLoadingMsg();
                    call('GET', 'Settings').then(function (s) {
                        el('pgsqlHost').value = s.host || '';
                        el('pgsqlPort').value = s.port || 5432;
                        el('pgsqlDatabase').value = s.database || '';
                        el('pgsqlUsername').value = s.username || '';
                        el('pgsqlPassword').value = '';
                        el('pgsqlPassword').placeholder = s.hasPassword ? 'unchanged' : '';
                        el('pgsqlCurrent').textContent = s.usesPostgreSql
                            ? 'Jellyfin is using PostgreSQL.'
                            : 'Jellyfin is using ' + s.databaseType + '.';
                        switchBackNotice = s.switchBackNotice || '';
                        el('pgsqlSqlite').disabled = !s.usesPostgreSql || !s.sqliteDatabaseExists;
                        lines(el('pgsqlWarnings'), s.warnings, '#cc9900');
                        Dashboard.hideLoadingMsg();
                    }, function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert('Could not load the database settings.');
                    });
                }

                function confirmAction(message, title, action) {
                    if (Dashboard.confirm) {
                        Dashboard.confirm(message, title, function (confirmed) { if (confirmed) { action(); } });
                    } else if (window.confirm(message)) {
                        action();
                    }
                }

                function act(path, body) {
                    Dashboard.showLoadingMsg();
                    call('POST', path, body).then(function (r) {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert(r.message);
                        if (r.succeeded) {
                            el('pgsqlTestResult').textContent = '';
                        }
                    }, function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert('The request failed. Check the Jellyfin log.');
                    });
                }

                page.addEventListener('pageshow', load);

                el('pgsqlTest').addEventListener('click', function () {
                    Dashboard.showLoadingMsg();
                    call('POST', 'Test', settings()).then(function (a) {
                        Dashboard.hideLoadingMsg();
                        showAssessment(a);
                    }, function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert('The request failed. Check the Jellyfin log.');
                    });
                });

                page.querySelector('.pgsqlForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    confirmAction(
                        'Jellyfin will restart and use this PostgreSQL database. Continue?',
                        'Save and restart',
                        function () { act('Apply', settings()); });
                    return false;
                });

                el('pgsqlSqlite').addEventListener('click', function () {
                    confirmAction(
                        switchBackNotice + ' Jellyfin will restart. Continue?',
                        'Switch back to SQLite',
                        function () { act('SwitchToSqlite'); });
                });
            })();
        </script>
    </div>
</body>
</html>
